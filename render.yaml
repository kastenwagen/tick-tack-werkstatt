# Render Blueprint: statische Seite aus ./website mit Sicherheits-Headern
services:
  - type: web
    name: tick-tack-werkstatt
    runtime: static
    buildCommand: node build-website.js
    staticPublishPath: ./website
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'sha256-uE7jRYMaZDMRo7fIMMIr8fk6VLncXQnPOXL8Zrqu1r4='; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "no-referrer"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
